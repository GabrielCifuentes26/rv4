    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg:      #f0f4f8;
            --surface: #ffffff;
            --navy:    #0f172a;
            --navy2:   #1e293b;
            --gray:    #64748b;
            --gray2:   #94a3b8;
            --border:  #e2e8f0;
            --ng:      #C9A84C;
            --blue:    #3b82f6;
            --green:   #15803d;
            --shadow:  0 4px 24px rgba(15,23,42,0.10);
        }
        body { font-family:'Inter','Segoe UI',sans-serif; background:var(--bg); color:var(--navy); min-height:100vh; }

        /* ── TOPBAR ──────────────────────────────── */
        .topbar {
            position:sticky; top:0; z-index:300;
            background:#0f172a; border-bottom:1px solid rgba(255,255,255,0.07);
            padding:0 22px; height:56px;
            display:flex; align-items:center; justify-content:space-between;
            box-shadow:0 2px 16px rgba(15,23,42,0.25);
        }
        .topbar::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent 0%,#C9A84C 35%,#C9A84C 65%,transparent 100%);
        }
        .topbar-left { display:flex; align-items:center; }
        .home-link {
            display:flex; align-items:center; justify-content:center;
            width:36px; height:36px; border-radius:8px;
            background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
            color:rgba(255,255,255,0.6); text-decoration:none;
            transition:background .18s,color .18s; flex-shrink:0; margin-right:14px;
        }
        .home-link:hover { background:#C9A84C; color:#fff; border-color:#C9A84C; }
        .home-link svg { width:15px; height:15px; fill:currentColor; }
        .topbar-center {
            position:absolute; left:50%; transform:translateX(-50%);
            text-align:center; pointer-events:none;
        }
        .topbar-page-title { font-size:1.05rem; font-weight:900; color:#fff; letter-spacing:-.2px; }
        .topbar-page-title span { color:#C9A84C; }
        .topbar-page-sub { font-size:0.62rem; color:rgba(255,255,255,0.45); margin-top:2px; }
        .brand-link { text-decoration:none; }
        .topbar-brand { font-size:.88rem; font-weight:900; color:#fff; }
        .topbar-brand span { color:#C9A84C; }
        .topbar-sub-brand { font-size:.58rem; color:rgba(255,255,255,.38); margin-top:1px; }
        .topbar-right { display:flex; align-items:center; gap:10px; }
        .btn-logout {
            display:flex; align-items:center; gap:6px;
            background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.30);
            color:#f87171; padding:5px 14px; border-radius:7px;
            font-size:.72rem; font-weight:700; cursor:pointer; font-family:inherit;
            transition:background .18s,border-color .18s,color .18s;
        }
        .btn-logout:hover { background:rgba(239,68,68,.22); border-color:rgba(239,68,68,.55); color:#fca5a5; }
        .btn-logout svg { width:13px; height:13px; fill:currentColor; }

        /* ── PAGE HERO ───────────────────────────── */
        .page-hero {
            background:var(--surface); border-bottom:1.5px solid var(--border);
            padding:20px 28px 18px;
        }
        .page-hero-inner {
            max-width:1320px; margin:0 auto;
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
        }
        .page-hero-eyebrow {
            font-size:.68rem; font-weight:700; color:var(--ng);
            text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;
        }
        .page-hero-title { font-size:1.4rem; font-weight:900; color:var(--navy); line-height:1.2; }
        .page-hero-title span { color:var(--ng); }
        .page-hero-sub { font-size:.82rem; color:var(--gray); margin-top:4px; line-height:1.5; }

        /* ── KPI STRIP ───────────────────────────── */
        .kpi-strip {
            background:var(--surface);
            border-bottom:2px solid var(--border);
            padding:0 28px;
        }
        .kpi-strip-inner {
            max-width:1320px; margin:0 auto;
            display:flex; align-items:stretch;
        }
        .kpi-item {
            flex:1; min-width:0;
            display:flex; align-items:center; gap:13px;
            padding:14px 18px;
            border-right:1px solid var(--border);
        }
        .kpi-item:last-child { border-right:none; }
        .kpi-icon {
            width:36px; height:36px; border-radius:10px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .kpi-icon svg { width:17px; height:17px; fill:currentColor; }
        .kpi-body {}
        .kpi-label { font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--gray2); margin-bottom:2px; white-space:nowrap; }
        .kpi-val   { font-size:.95rem; font-weight:900; font-variant-numeric:tabular-nums; }
        .kpi-icon--sap  { background:rgba(201,168,76,.12); color:#A8832A; }
        .kpi-icon--ejec { background:rgba(59,130,246,.10); color:#2563eb; }
        .kpi-icon--comp { background:rgba(245,158,11,.12); color:#d97706; }
        .kpi-icon--asig { background:rgba(21,128,61,.10);  color:#15803d; }
        .kpi-icon--disp { background:rgba(100,116,139,.10);color:#475569; }
        .kpi-icon--pct  { background:rgba(99,102,241,.10); color:#4f46e5; }
        .kpi-val--sap  { color:#A8832A; }
        .kpi-val--ejec { color:#2563eb; }
        .kpi-val--comp { color:#d97706; }
        .kpi-val--asig { color:#15803d; }
        .kpi-val--disp { color:#475569; }
        .kpi-val--pct  { color:#4f46e5; }

        /* ── MAIN ────────────────────────────────── */
        .main { max-width:1320px; margin:0 auto; padding:28px 28px 56px; }
        .main-top {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:20px;
        }
        .main-label { font-size:.68rem; font-weight:700; color:var(--gray2); text-transform:uppercase; letter-spacing:1px; }
        .date-pill {
            display:inline-flex; align-items:center; gap:5px;
            background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.2);
            color:#A8832A; padding:5px 13px; border-radius:20px;
            font-size:.63rem; font-weight:700;
        }
        .date-pill svg { width:10px; height:10px; fill:currentColor; }

        /* ── CARDS GRID ──────────────────────────── */
        .cards-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
        }

        /* PROJECT CARD */
        .pcard {
            background:var(--surface);
            border-radius:18px;
            border:1.5px solid var(--border);
            border-top:3px solid var(--ng);
            box-shadow:var(--shadow);
            overflow:hidden;
            display:flex; flex-direction:column;
            transition:transform .2s ease, box-shadow .2s ease;
            animation:fadeUp .45s ease both;
        }
        .pcard:hover {
            transform:translateY(-3px);
            box-shadow:0 10px 36px rgba(15,23,42,0.14);
        }
        @keyframes fadeUp {
            from{opacity:0;transform:translateY(14px)}
            to{opacity:1;transform:translateY(0)}
        }
        .pcard:nth-child(1){animation-delay:.04s}
        .pcard:nth-child(2){animation-delay:.10s}
        .pcard:nth-child(3){animation-delay:.16s}
        .pcard:nth-child(4){animation-delay:.22s}
        .pcard:nth-child(5){animation-delay:.28s}
        .pcard:nth-child(6){animation-delay:.34s}

        /* card header */
        .pcard-head { padding:18px 22px 14px; }
        .pcard-head-top {
            display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
        }
        .pcard-name { font-size:1.05rem; font-weight:800; color:var(--navy); line-height:1.2; }
        .pcard-pct-group { text-align:right; flex-shrink:0; }
        .pcard-pct-label { font-size:.65rem; font-weight:700; color:var(--gray2); text-transform:uppercase; letter-spacing:.6px; }
        .pcard-pct-val { font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; }
        .pcard-pct-val.ok     { color:#15803d; }
        .pcard-pct-val.warn   { color:#d97706; }
        .pcard-pct-val.danger { color:#dc2626; }

        /* divider */
        .pcard-divider { height:1px; background:var(--border); margin:0 22px 16px; }

        /* area table */
        .pcard-table { width:100%; border-collapse:collapse; margin:0 0 16px; }
        .pcard-table thead th {
            font-size:.63rem; font-weight:700; color:var(--gray2);
            text-transform:uppercase; letter-spacing:.7px;
            padding:0 22px 8px; text-align:right; border-bottom:1.5px solid var(--border);
        }
        .pcard-table thead th:first-child { text-align:left; }
        .pcard-table tbody td {
            font-size:.74rem; color:var(--navy);
            padding:9px 22px; text-align:right; font-variant-numeric:tabular-nums;
        }
        .pcard-table tbody td:first-child { text-align:left; font-weight:600; color:var(--gray); }
        .pcard-table tbody tr:not(:last-child) td { border-bottom:1px solid #f1f5f9; }

        /* total row */
        .pcard-table tfoot td {
            font-size:.74rem; font-weight:800;
            padding:9px 22px; text-align:right;
            border-top:1.5px solid var(--border);
            font-variant-numeric:tabular-nums;
        }
        .pcard-table tfoot td:first-child { text-align:left; color:var(--gray); }
        .pcard-table tfoot td.td-sap   { color:var(--navy2); }
        .pcard-table tfoot td.td-asig  { color:#1d4ed8; }
        .pcard-table tfoot td.td-pct   { }
        .pcard-table tfoot td.td-pct.ok     { color:#15803d; }
        .pcard-table tfoot td.td-pct.warn   { color:#d97706; }
        .pcard-table tfoot td.td-pct.danger { color:#dc2626; }

        .td-area-dot {
            display:inline-flex; align-items:center; gap:6px;
        }
        .area-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block; }
        .area-dot--constr { background:var(--ng); }
        .area-dot--urban  { background:var(--blue); }

        /* stacked bar */
        .pcard-bar-wrap { padding:0 22px 18px; }
        .pcard-bar-track {
            height:8px; border-radius:999px; overflow:hidden;
            display:flex; background:#e2e8f0; margin-bottom:8px;
        }
        .pcard-bar-constr { height:100%; background:var(--ng); transition:width 1s ease; }
        .pcard-bar-urban  { height:100%; background:var(--blue); transition:width 1s ease; }
        .pcard-bar-legend { display:flex; justify-content:space-between; }
        .pcard-bar-leg-item { display:flex; align-items:center; gap:5px; font-size:.7rem; font-weight:600; color:var(--gray2); }

        /* ── TOTAL CARD ─────────────────────────── */
        .total-card {
            grid-column:1/-1;
            background:var(--surface);
            border-radius:18px;
            border:1.5px solid var(--border);
            border-top:3px solid var(--ng);
            box-shadow:var(--shadow);
            padding:22px 28px;
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px;
        }
        .total-left-label { font-size:.68rem; font-weight:700; color:var(--ng); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
        .total-left-title { font-size:1rem; font-weight:900; color:var(--navy); }
        .total-left-sub { font-size:.72rem; color:var(--gray2); margin-top:2px; }
        .total-kpis { display:flex; align-items:center; gap:0; flex-wrap:wrap; }
        .total-kpi  { padding:0 28px; text-align:center; }
        .total-kpi:first-child { padding-left:0; }
        .total-kpi-label { font-size:.58rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--gray2); margin-bottom:5px; }
        .total-kpi-val { font-size:1.4rem; font-weight:900; font-variant-numeric:tabular-nums; }
        .total-kpi-val.t-sap  { color:#A8832A; }
        .total-kpi-val.t-asig { color:#2563eb; }
        .total-kpi-val.t-pct.ok     { color:#15803d; }
        .total-kpi-val.t-pct.warn   { color:#d97706; }
        .total-kpi-val.t-pct.danger { color:#dc2626; }
        .total-sep { width:1px; height:44px; background:var(--border); }

        /* skeleton */
        .skel { background:#e2e8f0; border-radius:6px; animation:pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

        /* responsive */
        @media(max-width:1100px){ .cards-grid{grid-template-columns:repeat(2,1fr);} }
        @media(max-width:680px){
            .page-hero{padding:18px;}
            .main{padding:18px 16px 40px;}
            .cards-grid{grid-template-columns:1fr;}
            .page-hero-title{font-size:1.2rem;}
            .total-card{padding:18px;}
            .total-kpis{gap:16px;}
            .total-kpi{padding:0;}
            .total-sep{display:none;}
        }
    </style>
</head>

    {key:'cse',name:'Condado Santa Elena',    json:'data/powerbi/cse/resumen-powerbi.json'},
    {key:'hlq',name:'Hacienda La Querencia',  json:'data/powerbi/hlq/resumen-powerbi.json'},
    {key:'rdb',name:'Reserva del Bosque',     json:'data/powerbi/rdb/resumen-powerbi.json'},
];

function fmt(v){
    if(!v||isNaN(v))return'—';
    return'Q '+(v/1e6).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})+'M';
}
function pctCls(p){
    if(p==null)return'';
    return p>=100?'danger':p>=90?'warn':'ok';
}
function fmtPct(p){
    return p!=null?p.toFixed(1)+'%':'—';
}

function buildCard(proj,areas){
    const sapTotal =areas.reduce((s,a)=>s+(a.sap||0),0);
    const asigTotal=areas.reduce((s,a)=>s+(a.asig||0),0);
    const pctTotal =sapTotal>0?(asigTotal/sapTotal*100):null;
    const cls=pctCls(pctTotal);

    // stacked bar widths by SAP proportion
    const totalSapForBar=areas.reduce((s,a)=>s+(a.sap||0),0)||1;
    const constrPct=((areas[0]?.sap||0)/totalSapForBar*100).toFixed(1);
    const urbPct  =((areas[1]?.sap||0)/totalSapForBar*100).toFixed(1);

    const areaRows=areas.map((a,i)=>{
        const p=a.sap>0?(a.asig/a.sap*100):null;
        const dotCls=i===0?'area-dot--constr':'area-dot--urban';
        const tdPctCls=pctCls(p);
        return `<tr>
            <td><span class="td-area-dot"><span class="area-dot ${dotCls}"></span>${a.name}</span></td>
            <td>${fmt(a.sap)}</td>
            <td>${fmt(a.asig)}</td>
            <td class="${tdPctCls}" style="font-weight:700">${fmtPct(p)}</td>
        </tr>`;
    }).join('');

    const card=document.createElement('div');
    card.className='pcard';
    card.innerHTML=`
        <div class="pcard-head">
            <div class="pcard-head-top">
                <div class="pcard-name">${proj.name}</div>
                <div class="pcard-pct-group">
                    <div class="pcard-pct-label">% Asignado</div>
                    <div class="pcard-pct-val ${cls}">${fmtPct(pctTotal)}</div>
                </div>
            </div>
        </div>
        <div class="pcard-divider"></div>
        <table class="pcard-table">
            <thead>
                <tr>
                    <th>Área</th>
                    <th>Ppto. SAP</th>
                    <th>Asignado</th>
                    <th>% Asig.</th>
                </tr>
            </thead>
            <tbody>${areaRows}</tbody>
            <tfoot>
                <tr>
                    <td>Total</td>
                    <td class="td-sap">${fmt(sapTotal)}</td>
                    <td class="td-asig">${fmt(asigTotal)}</td>
                    <td class="td-pct ${cls}">${fmtPct(pctTotal)}</td>
                </tr>
            </tfoot>
        </table>
        <div class="pcard-bar-wrap">
            <div class="pcard-bar-track">
                <div class="pcard-bar-constr" data-w="${constrPct}" style="width:0"></div>
                <div class="pcard-bar-urban"  data-w="${urbPct}"   style="width:0"></div>
            </div>
            <div class="pcard-bar-legend">
                <div class="pcard-bar-leg-item">
                    <span class="area-dot area-dot--constr"></span>Construcción (${constrPct}%)
                </div>
                <div class="pcard-bar-leg-item">
                    <span class="area-dot area-dot--urban"></span>Urbanización (${urbPct}%)
                </div>
            </div>
        </div>
    `;
    return card;
}

function buildTotalCard(sap,asig){
    const pct=sap>0?(asig/sap*100):null;
    const cls=pctCls(pct);
    const card=document.createElement('div');
    card.className='total-card';
    card.innerHTML=`
        <div>
            <div class="total-left-label">Consolidado · 6 Proyectos</div>
            <div class="total-left-title">Total General</div>
            <div class="total-left-sub">Construcción + Urbanización</div>
        </div>
        <div class="total-kpis">
            <div class="total-kpi">
                <div class="total-kpi-label">Ppto. SAP</div>
                <div class="total-kpi-val t-sap">${fmt(sap)}</div>
            </div>
            <div class="total-sep"></div>
            <div class="total-kpi">
                <div class="total-kpi-label">Asignado</div>
                <div class="total-kpi-val t-asig">${fmt(asig)}</div>
            </div>
            <div class="total-sep"></div>
            <div class="total-kpi">
                <div class="total-kpi-label">% Asignado</div>
                <div class="total-kpi-val t-pct ${cls}">${fmtPct(pct)}</div>
            </div>
        </div>
    `;
    return card;
}

function animateBars(){
    document.querySelectorAll('.pcard-bar-constr,.pcard-bar-urban').forEach(el=>{
        el.style.width=(el.dataset.w||0)+'%';
    });
}

function getAreaName(row){
    return row['Rubros[Area]']||row['dimSegmentación[Area]']||row['dimSegmentacion[Area]']||'';
}
function getArea(ds,name){
    return(ds?.porArea||[]).find(r=>getAreaName(r).toLowerCase()===name.toLowerCase())||null;
}

async function loadSB(){
    const{data,error}=await sb.from('powerbi_resumen_cache')
        .select('project_key,payload,mes_a')
        .in('project_key',PROJECTS.map(p=>p.key))
        .eq('is_current',true);
    if(error||!data?.length)return null;
    const map={};data.forEach(r=>{map[r.project_key]=r;});return map;
}
async function loadJSON(proj){
    const r=await fetch(proj.json+'?_='+Date.now());
    return r.ok?r.json():null;
}

async function init(){
    try{
        const sbMap=await loadSB();
        const grid=document.getElementById('cards-grid');
        grid.innerHTML='';
        let gSap=0,gAsig=0,mes='';
        let tSap=0,tEjec=0,tComp=0,tAsig=0,tDisp=0;

        for(const proj of PROJECTS){
            let payload=null,mesA='';
            if(sbMap?.[proj.key]){
                const row=sbMap[proj.key];
                try{payload=typeof row.payload==='string'?JSON.parse(row.payload):row.payload;}catch{}
                mesA=row.mes_a||'';
            }
            if(!payload){
                const j=await loadJSON(proj).catch(()=>null);
                if(j){payload=j;mesA=j.metadata?.filters?.mesA||'';}
            }
            if(!payload)continue;
            if(mesA&&!mes)mes=mesA;

            const ds=payload.datasets||payload;

            // accumulate ALL areas from porArea for KPI strip (full project total)
            const allAreas=Array.isArray(ds.porArea)?ds.porArea:[];
            allAreas.forEach(row=>{
                tSap  +=(row['[PresupuestoErequester]']??row['[RdiTotal]']??0);
                tEjec +=(row['[EjecutadoErequester]']??0);
                tComp +=(row['[ComprometidoErequester]']??0);
                tAsig +=(row['[AsignadoErequester]']??0);
                tDisp +=(row['[DisponibleErequester]']??0);
            });

            // accumulate Construcción + Urbanización for cards
            const areas=['Construcción','Urbanización'].map(name=>{
                const d=getArea(ds,name);
                const sap  = d?.['[PresupuestoErequester]'] ?? d?.['[RdiTotal]'] ?? 0;
                const asig = d?.['[AsignadoErequester]'] ?? 0;
                return{name,sap,asig};
            });
            areas.forEach(a=>{gSap+=a.sap;gAsig+=a.asig;});
            grid.appendChild(buildCard(proj,areas));
        }

        grid.appendChild(buildTotalCard(gSap,gAsig));

        // populate KPI strip
        const gp=tSap>0?(tAsig/tSap*100):null;
        document.getElementById('ks-sap').textContent =fmt(tSap);
        document.getElementById('ks-ejec').textContent=fmt(tEjec);
        document.getElementById('ks-comp').textContent=fmt(tComp);
        document.getElementById('ks-asig').textContent=fmt(tAsig);
        document.getElementById('ks-disp').textContent=fmt(tDisp);
        document.getElementById('ks-pct').textContent =fmtPct(gp);

        const dateStr=mes?mes.toUpperCase():'—';

        requestAnimationFrame(()=>setTimeout(animateBars,150));

    }catch(e){
        console.error(e);
        document.getElementById('cards-grid').innerHTML=
            `<div style="color:#dc2626;padding:48px;grid-column:1/-1;text-align:center;font-size:.85rem">Error: ${e.message}</div>`;
    }
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
